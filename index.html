<!doctype html>
<html lang="es" class="min-h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FULVO | Entrená tu conocimiento de fútbol</title>

    <!-- Favicon: la bola sola del logo de FULVO. Cuadrados, múltiplos de 48 (requisito de Google).
         Nombres propios (no goaldemy.png) porque vercel.json cachea los .png como immutable. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Google Fonts - Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <!-- Primary Meta Tags -->
    <meta name="title" content="FULVO | Entrená tu conocimiento de fútbol" />
    <meta
      name="description"
      content="FULVO es una app de micro-juegos de fútbol para entrenar tu conocimiento: adiviná jugadores, armá rachas, sumá logros y competí en el ranking."
    />
    <link rel="canonical" href="https://fulvo.com.ar/" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="index,follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="FULVO | Entrená tu conocimiento de fútbol" />
    <meta property="og:site_name" content="FULVO" />
    <meta
      property="og:description"
      content="FULVO es una app de micro-juegos de fútbol para entrenar tu conocimiento: adiviná jugadores, armá rachas, sumá logros y competí en el ranking."
    />
    <meta property="og:image" content="https://fulvo.com.ar/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://fulvo.com.ar/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FULVO | Entrená tu conocimiento de fútbol" />
    <meta
      name="twitter:description"
      content="FULVO es una app de micro-juegos de fútbol para entrenar tu conocimiento: adiviná jugadores, armá rachas, sumá logros y competí en el ranking."
    />
    <meta name="twitter:image" content="https://fulvo.com.ar/og-image.png" />
    <meta name="twitter:url" content="https://fulvo.com.ar/" />

    <!-- Structured data: le da a Google contexto extra para sitelinks / search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FULVO",
      "url": "https://fulvo.com.ar/",
      "description": "FULVO es una app de micro-juegos de fútbol para entrenar tu conocimiento: adiviná jugadores, armá rachas, sumá logros y competí en el ranking.",
      "inLanguage": "es-AR"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FULVO",
      "url": "https://fulvo.com.ar/",
      "logo": "https://fulvo.com.ar/favicon-192.png",
      "sameAs": ["https://www.instagram.com/fulvoapp/"]
    }
    </script>
  </head>
  <body class="min-h-full antialiased">
    <div class="min-h-full" id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
  
</html>
